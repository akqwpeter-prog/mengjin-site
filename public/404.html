<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 · 曹孟锦</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://mengjin-site.pages.dev/">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mengjin-theme") || "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: var(--font-display, "PingFang SC", "Hiragino Sans GB", sans-serif);
      color: var(--color-ink, #e8ecf4);
      background:
        radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--color-accent, #1a5dff) 22%, transparent), transparent 60%),
        var(--color-paper, #0b0f1a);
      text-align: center;
    }
    .err { font-size: clamp(6rem, 22vw, 13rem); line-height: 1; font-weight: 800; letter-spacing: -0.06em; margin: 0; }
    .err span { background: linear-gradient(120deg, var(--color-accent, #1a5dff), var(--color-ink, #e8ecf4)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 1rem 0 0.5rem; font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 600; }
    p { margin: 0 auto 2rem; max-width: 34ch; opacity: 0.72; font-size: 1rem; }
    a {
      display: inline-block;
      padding: 0.85em 2em;
      border-radius: 999px;
      color: #fff;
      background: var(--color-accent, #1a5dff);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s var(--ease-out, ease), box-shadow 0.2s var(--ease-out, ease);
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 12px 32px color-mix(in srgb, var(--color-accent, #1a5dff) 35%, transparent); }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="err" aria-hidden="true"><span>404</span></p>
    <h1>这个页面走丢了</h1>
    <p>你访问的内容可能已被移动，或链接已失效。回首页继续逛吧。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
